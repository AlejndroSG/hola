<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pago recibido — Web Roast Express</title><style>:root{--bg:#f7efe9;--ink:#211d1b;--accent:#b83f08;--muted:#6f625d;--line:rgba(33,29,27,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.card{width:min(760px,calc(100% - 32px));padding:clamp(30px,6vw,70px);border:1px solid var(--line);background:#fff8f1}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:18px 0;font-size:clamp(48px,8vw,88px);letter-spacing:-.07em;line-height:.86}p{max-width:590px;color:var(--muted);font-size:18px;line-height:1.5}.cta{display:inline-flex;margin-top:18px;padding:16px 18px;background:var(--ink);color:white;text-decoration:none;font-weight:750}.cta:hover{background:var(--accent)}small{display:block;margin-top:22px;color:var(--muted)}</style></head><body><main class="card"><div class="eyebrow">Web Roast Express / siguiente paso</div><h1>Ahora necesito tu URL.</h1><p>Envíame la página exacta que quieres que revise y el email donde quieres recibir el informe. Se audita una página por compra.</p><a class="cta" id="send" href="#">Enviar mi URL →</a><small>Entrega prevista: máximo 24 h desde que recibamos la URL.</small></main><script>const subject=encodeURIComponent('Web Roast Express — URL para auditar');const body=encodeURIComponent('Hola, ya he realizado el pago de Web Roast Express.\n\nURL a revisar: \nEmail de entrega: \nContexto opcional del negocio: \n');document.getElementById('send').href=`mailto:holaoncreativestudio@gmail.com?subject=${subject}&body=${body}`;</script></body></html>
